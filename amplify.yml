version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(SESSION_SECRET|DYNAMODB_ORDERS_TABLE|DYNAMODB_RIDERS_TABLE|DEV_MODE|NEXT_PUBLIC_DEV_MODE)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
